name: Build Azka4 EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-azka4:
    runs-on: windows-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Compile C++ menjadi EXE
        run: g++ -static "azka4.cpp" -o "azka4.exe"

      - name: Upload file EXE
        uses: actions/upload-artifact@v4
        with:
          name: hasil-azka4
          path: "azka4.exe"
